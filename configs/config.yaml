# 训练配置
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"
  early_stopping_patience: 10
  
# 数据配置  
data:
  image_size: [512, 512]
  num_classes: 6  # 根据实际类别调整
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augmentation: true
  
# 模型配置
model:
  name: "unet"  # ["unet", "deeplabv3", "segformer"]
  backbone: "resnet50"
  pretrained: true
  in_channels: 3  # RGB图像，多光谱可调整
  
# 类别定义
classes:
  0: "background"
  1: "building"
  2: "road"
  3: "vegetation"
  4: "water"
  5: "bare_soil"
  
# 路径配置
paths:
  data_dir: "data/"
  checkpoint_dir: "checkpoints/"
  log_dir: "logs/"